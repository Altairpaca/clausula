name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          tracked="$(git ls-files)"
          if printf '%s\n' "$tracked" | grep -Eq '(^|/)(\.omo|\.opencode|\.codegraph)(/|$)|(^|/)\.env$|^clausula\.db$|^scripts/archaeology\.py$'; then
            echo "Forbidden local/runtime state is tracked:" >&2
            printf '%s\n' "$tracked" | grep -E '(^|/)(\.omo|\.opencode|\.codegraph)(/|$)|(^|/)\.env$|^clausula\.db$|^scripts/archaeology\.py$' >&2
            exit 1
          fi
      - name: Install test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest build
          python -m pip install -e ".[research]"
      - name: Test
        run: python -m pytest -q
      - name: Compile
        run: python -m compileall -q clausula tests
      - name: Validate whitespace
        run: git diff --check
      - name: Build wheel and sdist
        run: python -m build
