<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 520" role="img" aria-labelledby="title desc">
  <title id="title">Clausula deterministic investment decision system</title>
  <desc id="desc">Architecture showing external surfaces projecting one deterministic application state backed by versioned financial facts, policies, research evidence and audit history.</desc>
  <rect width="1160" height="520" rx="24" fill="#fbfaf6"/>
  <text x="52" y="50" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="700" fill="#18212b">Clausula · deterministic decision boundary</text>
  <text x="52" y="76" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#66717e">Agents can propose and query. Canonical financial state remains deterministic, versioned, local, and auditable.</text>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
    <text x="54" y="120" font-size="11" font-weight="700" letter-spacing="1.4" fill="#8a6842">INPUTS / EVIDENCE</text>
    <text x="410" y="120" font-size="11" font-weight="700" letter-spacing="1.4" fill="#234b63">DETERMINISTIC CORE</text>
    <text x="872" y="120" font-size="11" font-weight="700" letter-spacing="1.4" fill="#4f746b">PROJECTIONS</text>

    <g>
      <rect x="52" y="144" width="270" height="66" rx="13" fill="#f5efe7" stroke="#ddcfbd"/>
      <text x="74" y="172" font-size="14" font-weight="700" fill="#7d5d3a">Financial facts</text>
      <text x="74" y="193" font-size="12" fill="#74685b">transactions · prices · FX · metadata</text>
    </g>
    <g>
      <rect x="52" y="228" width="270" height="66" rx="13" fill="#f5efe7" stroke="#ddcfbd"/>
      <text x="74" y="256" font-size="14" font-weight="700" fill="#7d5d3a">Policies &amp; constraints</text>
      <text x="74" y="277" font-size="12" fill="#74685b">reserve · concentration · execution</text>
    </g>
    <g>
      <rect x="52" y="312" width="270" height="66" rx="13" fill="#f5efe7" stroke="#ddcfbd"/>
      <text x="74" y="340" font-size="14" font-weight="700" fill="#7d5d3a">Research evidence</text>
      <text x="74" y="361" font-size="12" fill="#74685b">sources · claims · contradiction · freshness</text>
    </g>

    <rect x="390" y="144" width="390" height="234" rx="18" fill="#eef2f5" stroke="#c9d3da"/>
    <text x="414" y="176" font-size="17" font-weight="700" fill="#234b63">Application state</text>
    <text x="414" y="200" font-size="12" fill="#61707d">versioned ledgers · portfolio valuation · policies</text>
    <text x="414" y="219" font-size="12" fill="#61707d">plans · decision memory · recommendation lifecycle</text>

    <g>
      <rect x="414" y="244" width="150" height="48" rx="10" fill="#ffffff" stroke="#d5dce1"/>
      <text x="489" y="264" text-anchor="middle" font-size="12" font-weight="700" fill="#234b63">Temporal semantics</text>
      <text x="489" y="281" text-anchor="middle" font-size="10.5" fill="#6b7580">effective · known · recorded</text>
    </g>
    <g>
      <rect x="582" y="244" width="174" height="48" rx="10" fill="#ffffff" stroke="#d5dce1"/>
      <text x="669" y="264" text-anchor="middle" font-size="12" font-weight="700" fill="#234b63">Capital / risk state</text>
      <text x="669" y="281" text-anchor="middle" font-size="10.5" fill="#6b7580">reserve · headroom · feasibility</text>
    </g>
    <g>
      <rect x="414" y="312" width="150" height="48" rx="10" fill="#ffffff" stroke="#d5dce1"/>
      <text x="489" y="332" text-anchor="middle" font-size="12" font-weight="700" fill="#234b63">Audit lineage</text>
      <text x="489" y="349" text-anchor="middle" font-size="10.5" fill="#6b7580">fact → plan → decision → review</text>
    </g>
    <g>
      <rect x="582" y="312" width="174" height="48" rx="10" fill="#ffffff" stroke="#d5dce1"/>
      <text x="669" y="332" text-anchor="middle" font-size="12" font-weight="700" fill="#234b63">Fail-closed boundaries</text>
      <text x="669" y="349" text-anchor="middle" font-size="10.5" fill="#6b7580">missing evidence ≠ optimistic state</text>
    </g>

    <g>
      <rect x="846" y="144" width="260" height="54" rx="12" fill="#edf3f0" stroke="#cbd8d4"/>
      <text x="976" y="166" text-anchor="middle" font-size="13" font-weight="700" fill="#3f665e">Capital Cockpit</text>
      <text x="976" y="184" text-anchor="middle" font-size="11" fill="#62716d">read-only decision workspace</text>
    </g>
    <g>
      <rect x="846" y="216" width="260" height="54" rx="12" fill="#edf3f0" stroke="#cbd8d4"/>
      <text x="976" y="238" text-anchor="middle" font-size="13" font-weight="700" fill="#3f665e">CLI / SDK / HTTP</text>
      <text x="976" y="256" text-anchor="middle" font-size="11" fill="#62716d">same typed application state</text>
    </g>
    <g>
      <rect x="846" y="288" width="260" height="54" rx="12" fill="#edf3f0" stroke="#cbd8d4"/>
      <text x="976" y="310" text-anchor="middle" font-size="13" font-weight="700" fill="#3f665e">MCP / agents</text>
      <text x="976" y="328" text-anchor="middle" font-size="11" fill="#62716d">advisory capability projection</text>
    </g>
    <g>
      <rect x="846" y="360" width="260" height="54" rx="12" fill="#edf3f0" stroke="#cbd8d4"/>
      <text x="976" y="382" text-anchor="middle" font-size="13" font-weight="700" fill="#3f665e">Backup / audit / replay</text>
      <text x="976" y="400" text-anchor="middle" font-size="11" fill="#62716d">reconstructable local history</text>
    </g>
  </g>

  <g fill="none" stroke-linecap="round" stroke-width="2">
    <path d="M322 177 H390" stroke="#b18a5f"/>
    <path d="M322 261 H390" stroke="#b18a5f"/>
    <path d="M322 345 H390" stroke="#b18a5f"/>
    <path d="M780 171 H846" stroke="#78998f"/>
    <path d="M780 243 H846" stroke="#78998f"/>
    <path d="M780 315 H846" stroke="#78998f"/>
    <path d="M780 387 H846" stroke="#78998f"/>
  </g>

  <rect x="388" y="430" width="394" height="46" rx="12" fill="#fffdf9" stroke="#d9d1c5"/>
  <text x="585" y="449" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-style="italic" fill="#7d5d3a">LLM output may advise; it never becomes financial truth by itself.</text>
  <text x="585" y="466" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#7c7469">local-first · deterministic · point-in-time · provenance-aware</text>
</svg>