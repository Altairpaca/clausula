[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "clausula"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
research = ["pypdf>=5,<7"]

[project.scripts]
clausula = "clausula.cli:main"
clausula-workspace = "clausula.api.workspace:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["clausula*"]
